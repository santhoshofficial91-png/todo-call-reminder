<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Reminder Call</title>
<style>
  :root{--bg:#f4f6fa;--card:#fff;--ink:#101828;--mute:#667085;--line:#e4e7ec;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#141a26;--ink:#eef1f7;--mute:#98a2b3;--line:#232b3a;--accent:#6b9cff}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Noto Sans Tamil",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 90px}
  h1{font-size:20px;margin:4px 0 2px}
  .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  input[type=text],input[type=datetime-local]{width:100%;max-width:100%;min-width:0;min-height:46px;box-sizing:border-box;-webkit-appearance:none;appearance:none;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.sm{padding:6px 10px;font-size:13px}
  button.big{width:100%;padding:14px;font-size:17px;background:var(--ok)}
  .grid{display:grid;gap:8px}
  .sec{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:16px 2px 6px}
  .task{display:flex;gap:10px;align-items:flex-start}
  .task .t{flex:1;min-width:0}
  .title{font-weight:600;word-break:break-word}
  .meta{font-size:12.5px;color:var(--mute);margin-top:2px}
  .late .meta{color:var(--bad)}
  .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .empty{color:var(--mute);text-align:center;padding:18px 0;font-size:14px}
  .msg{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;margin-bottom:10px}
  .hidden{display:none!important}

  /* call screen */
  #call{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    background:radial-gradient(circle at 50% 20%,#1e3a8a 0%,#0f172a 60%);color:#fff;
    padding:calc(48px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));text-align:center}
  #call .who{font-size:28px;font-weight:700;margin-top:6px}
  #call .state{opacity:.8;margin-top:6px;font-size:16px;min-height:22px}
  .avatar{width:112px;height:112px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;font-size:52px;margin:0 auto}
  .ring .avatar{animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}100%{box-shadow:0 0 0 34px rgba(34,197,94,0)}}
  .caps{width:100%;max-width:440px;min-height:120px;max-height:34vh;overflow:auto;text-align:left;font-size:17px;line-height:1.5}
  .caps .me{color:#93c5fd}
  .caps .ai{color:#fff}
  .btns{display:flex;gap:30px;justify-content:center;align-items:center}
  .cbtn{width:74px;height:74px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;padding:0}
  .cbtn.green{background:#16a34a}.cbtn.red{background:#dc2626}.cbtn.grey{background:rgba(255,255,255,.18)}
  .lbl{font-size:12px;opacity:.8;margin-top:6px}
  .cbtn.spk-off{opacity:.45}
  .cbtn.spk-on{background:#16a34a;opacity:1;box-shadow:0 0 0 4px rgba(255,255,255,.55)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reminder Call 📞</h1>
  <div class="sub" id="sub"></div>
  <div id="notice"></div>

  <!-- pairing -->
  <div class="card grid hidden" id="pair">
    <div><b>First-time setup</b></div>
    <div class="meta">Enter the pairing code Claude gave you.</div>
    <input type="text" id="code" placeholder="Pairing code" autocapitalize="off" autocomplete="off">
    <button id="pairBtn">Pair</button>
  </div>

  <div id="main" class="hidden">
    <div class="card grid">
      <button class="big" id="talk">📞 Talk to AI</button>
      <button class="ghost" id="enable">🔔 Enable alerts (notifications)</button>
      <div class="meta" id="enableInfo"></div>
    </div>

    <div class="card grid">
      <input type="text" id="newTitle" placeholder="New task (e.g. Pay the bill)" maxlength="200">
      <input type="datetime-local" id="newDue">
      <button id="addBtn">Add</button>
    </div>

    <div id="lists"></div>
  </div>
</div>

<!-- call overlay -->
<div id="call" class="hidden">
  <div>
    <div class="avatar" id="avatar">🤖</div>
    <div class="who">Reminder AI Call</div>
    <div class="state" id="cstate"></div>
  </div>
  <div class="caps" id="caps"></div>
  <div>
    <div class="btns" id="incoming">
      <div><button class="cbtn red" id="decline" aria-label="Decline">✕</button><div class="lbl">Decline</div></div>
      <div><button class="cbtn green" id="answer" aria-label="Answer">📞</button><div class="lbl">Answer</div></div>
    </div>
    <div class="btns hidden" id="active">
      <div><button class="cbtn grey" id="mute" aria-label="Mute">🎙</button><div class="lbl" id="muteLbl">Mic on</div></div>
      <div><button class="cbtn grey spk-off" id="spk" aria-label="Speaker on">🔊</button><div class="lbl" id="spkLbl">Speaker on</div></div>
      <div><button class="cbtn red" id="hang" aria-label="End">⏹</button><div class="lbl">End</div></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
