name: Build Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug 2>&1 | tee ../build.log
      - name: Publish APK to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk reminder-call.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest reminder-call.apk --title "Reminder Call APK" --notes "Latest build $(date -u +%F\ %T) UTC (commit ${GITHUB_SHA::7})" --latest
      - name: Save build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 200 build.log > build-error.txt || echo "no log" > build-error.txt
          gh release delete buildlog --yes --cleanup-tag || true
          gh release create buildlog build-error.txt --title "Build log" --notes "Last failed build" --prerelease
