name: FridayIOSTest
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  FridayIOSTest:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Friday Test
        NSAlarmKitUsageDescription: Friday needs permission to ring at your chosen reminder time.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santhosh.friday.iostest
        PRODUCT_NAME: FridayIOSTest
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Generated/Info.plist
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
