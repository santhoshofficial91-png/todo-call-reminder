name: FridayIOSTest
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  FridayIOSTest:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santhosh.friday.iostest
        PRODUCT_NAME: FridayIOSTest
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Friday Test
        INFOPLIST_KEY_NSAlarmKitUsageDescription: Friday needs permission to ring at your chosen reminder time.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
